# Battleship Server Configuration
# Copy this file to server.conf and edit as needed

# Network settings
port = 8888
bind_address = 0.0.0.0

# Database
db_path = battleship.db

# Server limits
max_clients = 100
msg_max_bytes = 65536

# Logging: DEBUG, INFO, WARN, ERROR
log_level = INFO
log_file =

# Session
session_timeout_seconds = 3600

# Game
disconnect_timeout_seconds = 30
